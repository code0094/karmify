services:
  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auxbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aux_dj_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed — only accessible from bot service via Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auxbot} -d ${POSTGRES_DB:-aux_dj_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
